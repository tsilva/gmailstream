name: Release
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
    inputs:
      publish_existing_tag:
        description: "Publish to PyPI even when the version tag already exists"
        required: false
        default: false
        type: boolean
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run --with ruff ruff check .
      - run: uv run --with pytest pytest

  build:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check-version.outputs.tag_exists == 'false' || inputs.publish_existing_tag }}
      release: ${{ steps.check-version.outputs.tag_exists == 'false' }}
      tag: ${{ steps.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check version
        id: check-version
        run: |
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          print(project["version"])
          PY
          )"
          tag="v${version}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Setup uv
        if: steps.check-version.outputs.tag_exists == 'false' || inputs.publish_existing_tag
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
      - name: Build package
        if: steps.check-version.outputs.tag_exists == 'false' || inputs.publish_existing_tag
        run: uv build
      - name: Store package artifacts
        if: steps.check-version.outputs.tag_exists == 'false' || inputs.publish_existing_tag
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-${{ github.sha }}
          path: dist/
      - name: Create GitHub release
        run: gh release create "$TAG" --title "$TAG" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}

  publish:
    needs: [build]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-${{ github.sha }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
